name: Release (Tauri desktop app)

# Builds the Tauri standalone app (native audio, no WASM involved at RUNTIME - see
# dsp-standalone) for Windows / macOS / Linux and publishes the installers as a GitHub
# Release, as a DRAFT so a human reviews and hits "Publish" - nothing goes public
# automatically.
#
# Gotcha: `tauri build`'s beforeBuildCommand runs the SAME `npm run build` as the web
# app, and the frontend bundles the Web-mode engine (wasm-graph-processor.ts) even for a
# Tauri build - it just isn't used at runtime. So this job builds the WASM engine first,
# same as pages.yml, purely so the frontend compiles; discovered because the first real
# release run failed on all 4 platforms with "Could not resolve dsp_wasm_bg.wasm".
#
# Triggered by pushing a version tag (matches this repo's existing v0.x.y convention),
# or manually from the Actions tab.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (webview + audio)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install wasm-bindgen-cli (pinned to the version in Cargo.lock)
        shell: bash
        run: |
          set -e
          VER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen-cli $VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked

      - name: Build WASM engine (needed by the frontend build even in Tauri mode)
        shell: pwsh
        run: ./scripts/build-wasm.ps1

      - name: npm ci
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NoobSynth3 ${{ github.ref_name }}'
          releaseBody: |
            Build automatique de l'application Tauri (mode standalone, audio natif) pour ${{ github.ref_name }}.
            Voir les commits pour le detail des changements de cette version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
