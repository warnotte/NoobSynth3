name: Release (Tauri desktop app)

# Builds the Tauri standalone app (native audio, no WASM involved - see dsp-standalone)
# for Windows / macOS / Linux and publishes the installers as a GitHub Release, as a
# DRAFT so a human reviews and hits "Publish" - nothing goes public automatically.
#
# Triggered by pushing a version tag (matches this repo's existing v0.x.y convention),
# or manually from the Actions tab.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (webview + audio)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: npm ci
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NoobSynth3 ${{ github.ref_name }}'
          releaseBody: |
            Build automatique de l'application Tauri (mode standalone, audio natif) pour ${{ github.ref_name }}.
            Voir les commits pour le detail des changements de cette version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
