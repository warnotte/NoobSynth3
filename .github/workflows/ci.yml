name: CI

# "Does it still compile and pass its tests?" on every push to main and every PR into
# main. This does NOT publish anything (see release.yml / pages.yml for that) - it's a
# fast, cheap safety net.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-test:
    name: Rust tests (all crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo test --workspace` also builds the `src-tauri` member, which needs the
      # Linux webview/GTK dev headers to compile at all (glib-sys/gobject-sys build
      # scripts shell out to pkg-config) - same package list as release.yml's Tauri job.
      - name: Install Linux webview/audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

  web-build:
    name: Web build (WASM + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (+ wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (pinned to the version in Cargo.lock)
        run: |
          set -e
          VER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen-cli $VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked

      - name: Build WASM engine
        shell: pwsh
        run: ./scripts/build-wasm.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Garde-fous presets (cables morts + parametres morts/hors plage)
        run: |
          npm run check:presets
          npm run check:preset-params

      - name: npm run build
        run: npm run build
